name: CI Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            VERSION="main-${COMMIT_SHA}"
            TAG="latest"
          else
            VERSION="dev-${COMMIT_SHA}"
            TAG="dev"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push flight-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: flight-service/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-flight:${{ steps.meta.outputs.commit_sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}-flight:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.title=data-connect-hub-flight
            org.opencontainers.image.description=Data Connect Hub - Flight Service (gRPC/Arrow Flight)
          cache-from: type=gha,scope=flight
          cache-to: type=gha,mode=max,scope=flight

      - name: Build and push rest-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rest-service/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-rest:${{ steps.meta.outputs.commit_sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}-rest:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.title=data-connect-hub-rest
            org.opencontainers.image.description=Data Connect Hub - REST Service (HTTP/actix-web)
          cache-from: type=gha,scope=rest
          cache-to: type=gha,mode=max,scope=rest

      - name: Output image tags
        run: |
          echo "Images pushed:"
          echo "  - ${{ env.REGISTRY }}/${{ github.repository }}-flight:${{ steps.meta.outputs.commit_sha }}"
          echo "  - ${{ env.REGISTRY }}/${{ github.repository }}-flight:${{ steps.meta.outputs.tag }}"
          echo "  - ${{ env.REGISTRY }}/${{ github.repository }}-rest:${{ steps.meta.outputs.commit_sha }}"
          echo "  - ${{ env.REGISTRY }}/${{ github.repository }}-rest:${{ steps.meta.outputs.tag }}"
